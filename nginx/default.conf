# =============================================================================
#  Vírgula Contábil — página de links + encurtador
#
#   1) serve a página em  https://links.virgulacontabil.com.br/
#   2) redireciona links curtos:  .../cliente  ->  https://cliente...
#   3) /editar  = editor visual, protegido por senha
#
#  Criar um link curto novo = copiar uma linha "location = /apelido { ... }"
#  abaixo, trocar o apelido e o destino, e dar git push.
#
#  A senha do /editar vem do Build Arg EDITOR_PASS (definido no EasyPanel) —
#  ver o Dockerfile e o README.
# =============================================================================

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Arquivos minúsculos e que mudam a cada edição no /editar.
    # "no-cache" = o navegador guarda mas SEMPRE revalida com o servidor
    # (resposta 304, ~0 byte, quando nada mudou). Sem isto, uma alteração
    # feita no editor só aparecia em aba anônima.
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript image/svg+xml application/json;
    gzip_min_length 512;

    # ---- LINKS CURTOS -----------------------------------------------------
    location = /cliente      { return 302 https://cliente.virgulacontabil.com.br; }
    location = /financeiro   { return 302 https://financeiro.virgulacontabil.com.br; }
    location = /calculadora  { return 302 https://calculadora.virgulacontabil.com.br; }
    location = /preco        { return 302 https://calculadora.virgulacontabil.com.br; }
    location = /trabalhista  { return 302 https://trabalhista.virgulacontabil.com.br; }
    location = /cursos       { return 302 https://cursos.virgulacontabil.com.br; }
    location = /blog         { return 302 https://virgulacontabil.com.br/blog; }
    location = /site         { return 302 https://virgulacontabil.com.br; }
    location = /wpp          { return 302 https://wa.me/5575991161728; }
    location = /whatsapp     { return 302 https://wa.me/5575991161728; }
    location = /ig           { return 302 https://instagram.com/lucasaraujocontador; }
    location = /email        { return 302 mailto:contato@virgulacontabil.com.br; }
    # ---------------------------------------------------------------------

    # ---- EDITOR (protegido por senha) -----------------------------------
    location = /editar {
        auth_basic           "Editor da Vírgula";
        auth_basic_user_file  /etc/nginx/.htpasswd;
        try_files /editor.html =404;
    }
    location = /editor.html {
        auth_basic           "Editor da Vírgula";
        auth_basic_user_file  /etc/nginx/.htpasswd;
    }
    # ---------------------------------------------------------------------

    # a página + estáticos (com fallback pra index)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
