# =============================================================================
#  Vírgula Contábil — página de links + encurtador
#
#  Este arquivo faz duas coisas:
#   1) serve a página (index.html) em  https://links.virgulacontabil.com.br/
#   2) redireciona links curtos, ex.:
#        https://links.virgulacontabil.com.br/cliente  ->  https://cliente...
#
#  Para criar um link curto novo: adicione uma linha no bloco "map" abaixo,
#  faça commit e o EasyPanel publica sozinho.
# =============================================================================

# ---- LINKS CURTOS -----------------------------------------------------------
#   /apelido      URL-de-destino;
#   Mantenha a linha `default ""` no topo — ela cobre "não é link curto".
map $uri $short_target {
    default                "";

    /cliente               https://cliente.virgulacontabil.com.br;
    /financeiro            https://financeiro.virgulacontabil.com.br;
    /calculadora           https://calculadora.virgulacontabil.com.br;
    /preco                 https://calculadora.virgulacontabil.com.br;
    /trabalhista           https://trabalhista.virgulacontabil.com.br;
    /cursos                https://cursos.virgulacontabil.com.br;
    /blog                  https://virgulacontabil.com.br/blog;
    /site                  https://virgulacontabil.com.br;
    /wpp                   https://wa.me/5575991161728;
    /whatsapp              https://wa.me/5575991161728;
    /ig                    https://instagram.com/lucasaraujocontador;
    /email                 mailto:contato@virgulacontabil.com.br;
}
# ---------------------------------------------------------------------------

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # segurança básica
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # compressão
    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;
    gzip_min_length 512;

    # 1) link curto? redireciona (301) e encerra.
    if ($short_target) {
        return 301 $short_target;
    }

    # 2) cache dos estáticos
    location ~* \.(?:css|js|svg|png|jpe?g|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 3) editor visual
    location = /editar {
        try_files /editor.html =404;
    }

    # 4) a página
    location / {
        try_files $uri $uri/ /index.html;
    }
}
