<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- ======================================================================
       SEO / compartilhamento — troque a URL se o domínio mudar
       ====================================================================== -->
  <title>Vírgula Contábil — Todos os links</title>
  <meta name="description" content="Área do cliente, painel financeiro, calculadora de preço, cursos, blog e contato da Vírgula Contábil num lugar só." />
  <link rel="canonical" href="https://links.virgulacontabil.com.br/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Vírgula Contábil" />
  <meta property="og:title" content="Vírgula Contábil — Todos os links" />
  <meta property="og:description" content="Área do cliente, painel financeiro, calculadora de preço, cursos, blog e contato — num lugar só." />
  <meta property="og:url" content="https://links.virgulacontabil.com.br/" />
  <meta property="og:image" content="https://links.virgulacontabil.com.br/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <meta name="theme-color" content="#022C22" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <main class="wrap">
    <div class="avatar reveal" aria-hidden="true">
      <svg viewBox="0 0 64 64">
        <text x="33" y="57" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif"
              font-weight="700" font-size="72" fill="#F97316">,</text>
      </svg>
    </div>

    <h1 class="name reveal" style="animation-delay:.05s">
      <span id="p-name">Vírgula</span><b>,</b>
    </h1>
    <span class="suffix reveal" id="p-suffix" style="animation-delay:.08s">Contábil</span>
    <p class="tagline reveal" id="p-tagline" style="animation-delay:.11s"></p>

    <nav class="links" id="links" aria-label="Meus links"></nav>
    <div class="socials" id="socials"></div>

    <noscript>
      <nav class="links" aria-label="Meus links">
        <a class="link link--primary" href="https://wa.me/5575991161728">Falar no WhatsApp</a>
        <a class="link" href="https://cliente.virgulacontabil.com.br">Área do Cliente</a>
        <a class="link" href="https://financeiro.virgulacontabil.com.br">Painel Financeiro</a>
        <a class="link" href="https://calculadora.virgulacontabil.com.br">Calculadora de Preço</a>
        <a class="link" href="https://virgulacontabil.com.br">Site oficial</a>
      </nav>
    </noscript>

    <footer class="foot reveal">
      © <span id="year"></span> Vírgula Contábil ·
      <a href="https://virgulacontabil.com.br" target="_blank" rel="noopener">virgulacontabil.com.br</a>
    </footer>
  </main>

  <script src="icons.js"></script>
  <script src="data.js"></script>
  <script>
    (function () {
      var DEFAULT = {
        profile: { name: 'Vírgula', suffix: 'Contábil', tagline: '' },
        links: [{ label: 'Site oficial', href: 'https://virgulacontabil.com.br', icon: 'globe' }],
        socials: []
      };
      var D = window.LINKTREE || DEFAULT;
      var P = D.profile || DEFAULT.profile;

      document.getElementById('p-name').textContent    = P.name || 'Vírgula';
      document.getElementById('p-suffix').textContent  = P.suffix || '';
      document.getElementById('p-tagline').textContent = P.tagline || '';
      document.getElementById('year').textContent      = new Date().getFullYear();
      document.title = ((P.name || '') + ' ' + (P.suffix || '')).trim() + ' — Todos os links';

      var esc = function (s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      };

      document.getElementById('links').innerHTML = (D.links || []).map(function (l, i) {
        return '<a class="link reveal ' + (l.primary ? 'link--primary' : '') + '"' +
          ' style="animation-delay:' + (0.14 + i * 0.05).toFixed(2) + 's"' +
          ' href="' + esc(l.href) + '" target="_blank" rel="noopener">' +
          window.iconSvg(l.icon, 22, 'link__icon') +
          '<span class="link__label">' + esc(l.label) + '</span>' +
          window.iconSvg('go', 20, 'link__go') +
          '</a>';
      }).join('');

      document.getElementById('socials').innerHTML = (D.socials || []).map(function (s) {
        return '<a class="social reveal" href="' + esc(s.href) + '" target="_blank" rel="noopener"' +
          ' aria-label="' + esc(s.label) + '" title="' + esc(s.label) + '">' +
          window.iconSvg(s.icon, 22, '') + '</a>';
      }).join('');
    })();
  </script>
</body>
</html>
